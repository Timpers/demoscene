<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PIXEL RIOT - a 320x200 intro</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #screen { position: relative; width: min(100vw, calc(100vh * 4 / 3)); aspect-ratio: 4 / 3; }
  canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; background: #000; }
  /* CRT scanlines */
  #screen::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.18) 3px);
  }
  #start {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 1em; background: #000; color: #fc0; cursor: pointer; z-index: 2;
    font: bold 4vmin "Courier New", monospace; letter-spacing: .2em; text-align: center;
  }
  #start small { color: #48f; font-size: 2.2vmin; }
  #start span { animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<div id="screen">
  <canvas id="c" width="320" height="200"></canvas>
  <div id="start">
    PIXEL RIOT
    <small>A 320x200 TRIBUTE TO THE ST &amp; AMIGA SCENE</small>
    <span>[ CLICK TO START - SOUND ON ]</span>
  </div>
</div>
<script src="demo.js"></script>
</body>
</html>
